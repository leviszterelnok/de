<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LDE Shell</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wallpaper" aria-hidden="true">
    <span class="blob blob-a"></span>
    <span class="blob blob-b"></span>
    <span class="blob blob-c"></span>
  </div>

  <header class="menubar">
    <div class="menubar-left">
      <button class="logo" aria-label="LDE menu" type="button">
        <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 1.5 14.5 8 8 14.5 1.5 8Z" fill="currentColor"/></svg>
      </button>
      <span class="menu-item strong" id="app-name">LDE</span>
      <span class="menu-item">File</span>
      <span class="menu-item">Edit</span>
      <span class="menu-item">View</span>
      <span class="menu-item">Window</span>
      <span class="menu-item">Help</span>
    </div>
    <div class="menubar-right">
      <svg class="status" viewBox="0 0 16 16" width="15" height="15" aria-label="Wi-Fi">
        <path d="M1.5 6a9.5 9.5 0 0 1 13 0M3.8 8.6a6.2 6.2 0 0 1 8.4 0M6.1 11.1a2.9 2.9 0 0 1 3.8 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="8" cy="13.4" r="1.2" fill="currentColor"/>
      </svg>
      <svg class="status" viewBox="0 0 22 12" width="22" height="12" aria-label="Battery">
        <rect x="0.75" y="0.75" width="18.5" height="10.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <rect x="2.5" y="2.5" width="12" height="7" rx="1.5" fill="currentColor"/>
        <path d="M20.5 4v4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <time id="clock" class="menu-item"></time>
    </div>
  </header>

  <nav class="dock" id="dock" aria-label="Dock" hidden></nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
